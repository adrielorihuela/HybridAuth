# Deletes branches nobody needs any more, so the branch list only shows work in progress.
#
#   - When a pull request from this repository is merged, its branch goes.
#   - Every week, and on demand, every branch whose commits are all already in main goes too: the
#     ones merged without a pull request, and any the first rule missed.
#
# Only branches with nothing outside main are ever deleted, so no work can be lost, and never main
# itself or a branch with an open pull request. A branch with unmerged commits, such as an
# upstream-update/<date> waiting for review, stays until its work is merged.

name: Branch cleanup
on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '53 5 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  merged-pull-request:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-24.04
    steps:
    - name: Delete the merged branch
      env:
        GH_TOKEN: ${{ github.token }}
        BRANCH: ${{ github.event.pull_request.head.ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        # Only if nothing was pushed to it after the merge.
        current="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" --jq .object.sha 2>/dev/null || true)"
        if [ -z "${current}" ]; then
          echo "${BRANCH} is already gone."
        elif [ "${current}" != "${HEAD_SHA}" ]; then
          echo "${BRANCH} has commits pushed after the merge; leaving it."
        else
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}"
          echo "Deleted ${BRANCH}."
        fi

  sweep:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        filter: blob:none
    - name: Delete branches already contained in main
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        open="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --limit 200 --json headRefName --jq '.[].headRefName')"
        git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin | while read -r branch; do
          case "${branch}" in main|HEAD) continue ;; esac
          if grep -qxF "${branch}" <<< "${open}"; then
            echo "keep    ${branch} (open pull request)"
          elif git merge-base --is-ancestor "origin/${branch}" origin/main; then
            git push origin --delete "${branch}"
            echo "deleted ${branch} (everything in it is in main)"
          else
            echo "keep    ${branch} ($(git rev-list --count "origin/main..origin/${branch}") commit(s) not in main)"
          fi
        done
