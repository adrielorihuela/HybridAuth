# Publishes a GitHub release for every pushed v* tag, with the runnable proxy jar attached.
# A tag with a hyphen in it (v1.3.0-beta.1) is published as a pre-release.

name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v5
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: 25
        distribution: 'zulu'
    # The jar is named after forkVersion, not the tag. A tag pushed without bumping it would
    # publish the previous release's jar under the new name, so refuse instead.
    - name: Check the tag matches forkVersion
      id: version
      run: |
        version="$(grep '^forkVersion=' gradle.properties | cut -d= -f2)"
        if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
          echo "::error::Tag ${GITHUB_REF_NAME} does not match forkVersion=${version} in gradle.properties."
          exit 1
        fi
        echo "version=${version}" >> "$GITHUB_OUTPUT"
    - name: Build with Gradle
      run: ./gradlew build
    # Only the runnable jar: HybridAuth-<version>-thin.jar exists to feed shadowJar and does not start.
    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        files: proxy/build/libs/HybridAuth-${{ steps.version.outputs.version }}.jar
        prerelease: ${{ contains(github.ref_name, '-') }}
        generate_release_notes: true
        fail_on_unmatched_files: true
